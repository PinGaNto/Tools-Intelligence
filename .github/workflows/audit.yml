name: Audit existing dashboard content

# Manual trigger only, on purpose — this re-judges and REMOVES existing
# items that fail the stricter editorial bar. Run it from the Actions tab
# whenever you want a cleanup pass, not on an automatic schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/audit.mjs

      - name: Commit changes if any
        run: |
          git config user.name "tool-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.js; then
            echo "Nothing removed — nothing to commit."
          else
            git add data.js
            git commit -m "Audit: remove items failing editorial bar $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
